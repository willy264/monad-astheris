[package]
name = "aetheris-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[dependencies]
alloy = { version = "1.0", default-features = false, features = ["std", "contract", "provider-http", "rpc-types", "signer-local", "reqwest-rustls-tls", "serde"] }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
hex = "0.4"
redb = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Test assertions and backtraces work without full dependency debug symbols.
# This keeps native test linking practical alongside frontend toolchains.
[profile.test]
debug = 0
