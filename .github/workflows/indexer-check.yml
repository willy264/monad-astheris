name: Indexer generated types
on:
  workflow_dispatch:
  pull_request:
    paths:
      - indexer/**
      - .github/workflows/indexer-check.yml
  push:
    branches: [feat/live-submission]
    paths:
      - indexer/**
      - .github/workflows/indexer-check.yml
permissions:
  contents: read
jobs:
  indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: indexer-generated-types
          path: indexer/.envio/types.d.ts
          include-hidden-files: true
          if-no-files-found: error
